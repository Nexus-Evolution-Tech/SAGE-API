name: Windows native release smoke

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: Commit exato do frontend SAGE
        required: true
        default: e8c5131e1d155e2bcf8d7c58ffefb4e81677407f
  push:
    branches: [agent/f8-windows-native-builder, agent/f8-mysql-bootstrap, agent/f8-windows-services]

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WEB_REF: ${{ inputs.web_ref || 'e8c5131e1d155e2bcf8d7c58ffefb4e81677407f' }}

    steps:
      - name: Checkout API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: api
          persist-credentials: false

      - name: Checkout frontend fixado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Nexus-Evolution-Tech/SAGE
          ref: ${{ env.WEB_REF }}
          path: web
          persist-credentials: false

      - name: Configurar Node 24 x64
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Confirmar Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "Builder exige Windows PowerShell 5.1; recebido $($PSVersionTable.PSVersion)"
          }
          if (-not [Environment]::Is64BitOperatingSystem) { throw 'Runner Windows não é x64' }

      - name: Restaurar cache de binários verificados
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\sage-build\artifacts
          key: windows-x64-artifacts-${{ hashFiles('api/installer/windows/artifacts.json') }}

      - name: Testar contratos do builder
        working-directory: api
        shell: powershell
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm ci da API falhou' }
          npx vitest run test/windows-artifacts.test.js test/fetch-windows-artifacts.test.js `
            test/assemble-windows-layout.test.js test/windows-native-builder-contract.test.js `
            test/windows-initialize-state-contract.test.js test/windows-mysql-bootstrap-contract.test.js `
            test/windows-services-contract.test.js test/start-with-setup.test.js `
            test/windows-ci-contract.test.js test/backup-maintenance-credential.test.js `
            test/contrato-diretorios.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Contratos Windows falharam' }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'Audit de produção da API falhou' }

      - name: Montar layout no Windows nativo
        shell: powershell
        run: |
          $api = Join-Path $env:GITHUB_WORKSPACE 'api'
          $web = Join-Path $env:GITHUB_WORKSPACE 'web'
          $work = Join-Path $env:RUNNER_TEMP 'sage-build'
          $output = Join-Path $env:RUNNER_TEMP 'sage-release-smoke'
          & (Join-Path $api 'installer\windows\build-release.ps1') `
            -ApiRepository $api -WebRepository $web `
            -WorkDirectory $work -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Builder Windows falhou' }

      - name: Validar layout sem publicar
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sage-release-smoke'
          $release = Get-Content -LiteralPath (Join-Path $output 'release.json') -Raw | ConvertFrom-Json
          if ($release.target -ne 'win32-x64') { throw 'Target inesperado no release.json' }
          if ($release.distribution.public -ne $false) { throw 'Smoke não pode produzir release público' }
          if ($release.source.apiCommit -ne $env:GITHUB_SHA) { throw 'SHA da API diverge do checkout' }
          if ($release.source.webCommit -ne $env:WEB_REF) { throw 'SHA do frontend diverge do checkout' }
          & (Join-Path $output 'runtime\node\node.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Node Windows do layout não executou' }
          & (Join-Path $output 'runtime\mysql\bin\mysqld.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'MySQL Windows do layout não executou' }
          $winswProbe = Join-Path $env:RUNNER_TEMP 'winsw-probe'
          New-Item -ItemType Directory -Path $winswProbe | Out-Null
          try {
            $winswExe = Join-Path $winswProbe 'SAGESmoke.exe'
            Copy-Item -LiteralPath (Join-Path $output 'service\SAGE-API.exe') -Destination $winswExe
            [IO.File]::WriteAllText((Join-Path $winswProbe 'SAGESmoke.xml'),
              '<service><id>SAGESmoke</id><name>SAGE Smoke</name><description>CI</description><executable>cmd.exe</executable></service>')
            & $winswExe version
            if ($LASTEXITCODE -ne 0) { throw 'WinSW Windows do layout não executou' }
          } finally { Remove-Item -LiteralPath $winswProbe -Recurse -Force }
          $api = Join-Path $output "releases\$($release.version)\api"
          Push-Location -LiteralPath $api
          try {
            & (Join-Path $output 'runtime\node\node.exe') -e `
              "require('bcrypt').hash('windows-smoke',4).then(()=>process.exit(0)).catch(()=>process.exit(1))"
            if ($LASTEXITCODE -ne 0) { throw 'bcrypt Windows do layout não carregou' }
          } finally { Pop-Location }

      - name: Provar bootstrap privado do MySQL
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sage-release-smoke'
          $state = Join-Path ([Environment]::GetFolderPath('CommonApplicationData')) 'SAGE'
          if (Test-Path -LiteralPath $state) { throw 'Runner não está limpo para o smoke MySQL' }
          & (Join-Path $output 'service\initialize-mysql.ps1')
          if (-not $?) { throw 'Bootstrap MySQL falhou' }
          $config = Join-Path $state 'config'
          if (-not (Test-Path -LiteralPath (Join-Path $config 'mysql-accounts.ready'))) {
            throw 'Bootstrap MySQL não promoveu o marcador'
          }
          if (Test-Path -LiteralPath (Join-Path $config 'mysql-bootstrap-client.cnf')) {
            throw 'Bootstrap MySQL preservou credencial root após sucesso'
          }

          $myIni = Join-Path $config 'mysql-smoke.ini'
          $mysqlRoot = Join-Path $output 'runtime\mysql'
          $data = (Join-Path $state 'mysql\data').Replace('\', '/')
          $base = $mysqlRoot.Replace('\', '/')
          [IO.File]::WriteAllLines($myIni, @(
            '[mysqld]', "basedir=$base", "datadir=$data", 'port=3307',
            'bind-address=127.0.0.1', 'mysqlx=0', 'skip-name-resolve'
          ), [Text.UTF8Encoding]::new($false))
          $mysqld = Join-Path $mysqlRoot 'bin\mysqld.exe'
          & $mysqld --install-manual SAGE-MySQL-Smoke "--defaults-file=$myIni"
          if ($LASTEXITCODE -ne 0) { throw 'Serviço temporário MySQL não instalou' }
          Start-Service SAGE-MySQL-Smoke
          $admin = Join-Path $mysqlRoot 'bin\mysqladmin.exe'
          $maintenance = Join-Path $config 'maintenance-client.cnf'
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            & $admin "--defaults-extra-file=$maintenance" ping --silent 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($LASTEXITCODE -ne 0) { throw 'Serviço temporário MySQL não ficou pronto' }
          & (Join-Path $output 'service\initialize-mysql.ps1')
          if (-not $?) { throw 'Segundo bootstrap MySQL não foi idempotente' }

          $release = Get-Content -LiteralPath (Join-Path $output 'release.json') -Raw | ConvertFrom-Json
          $api = Join-Path $output "releases\$($release.version)\api"
          $secretBytes = [byte[]]::new(32)
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($secretBytes) } finally { $rng.Dispose() }
          $env:SAGE_INITIAL_ADMIN_LOGIN = 'windows_ci_admin'
          $env:SAGE_INITIAL_ADMIN_PASSWORD = [Convert]::ToBase64String($secretBytes).Replace('+', '-').Replace('/', '_')
          $env:SAGE_INITIAL_SCHOOL_NAME = 'Unidade CI Windows'
          $env:SAGE_CONFIG_FILE = Join-Path $config 'maintenance.env'
          Push-Location -LiteralPath $api
          try {
            & (Join-Path $output 'runtime\node\node.exe') scripts/setup-database.js
            if ($LASTEXITCODE -ne 0) { throw 'Setup com manutenção restrita falhou' }
          } finally {
            Pop-Location
            Remove-Item Env:SAGE_INITIAL_ADMIN_LOGIN, Env:SAGE_INITIAL_ADMIN_PASSWORD, `
              Env:SAGE_INITIAL_SCHOOL_NAME, Env:SAGE_CONFIG_FILE
          }

          $env:SAGE_CONFIG_FILE = Join-Path $config 'sage.env'
          $env:SAGE_DATA_DIR = $state
          $env:MYSQLDUMP_PATH = Join-Path $mysqlRoot 'bin\mysqldump.exe'
          $env:MYSQL_PATH = Join-Path $mysqlRoot 'bin\mysql.exe'
          Push-Location -LiteralPath $api
          try {
            & (Join-Path $output 'runtime\node\node.exe') -e `
              "const b=require('./src/services/backupBanco');(async()=>{const x=await b.gerarBackup();const v=await b.verificarBackup(x.caminho);if(!v.ok)throw Error('backup restrito inválido')})().catch(e=>{console.error(e.message);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw 'Backup/restauração com grants restritos falhou' }
          } finally {
            Pop-Location
            Remove-Item Env:SAGE_CONFIG_FILE, Env:SAGE_DATA_DIR, Env:MYSQLDUMP_PATH, Env:MYSQL_PATH
          }
          Stop-Service SAGE-MySQL-Smoke
          & $mysqld --remove SAGE-MySQL-Smoke
          if ($LASTEXITCODE -ne 0) { throw 'Serviço temporário MySQL não foi removido' }

      - name: Descartar estado do smoke MySQL
        if: always()
        shell: powershell
        run: |
          $service = Get-Service SAGE-MySQL-Smoke -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service SAGE-MySQL-Smoke -Force }
            $mysqld = Join-Path $env:RUNNER_TEMP 'sage-release-smoke\runtime\mysql\bin\mysqld.exe'
            if (Test-Path -LiteralPath $mysqld) { & $mysqld --remove SAGE-MySQL-Smoke }
          }
          $state = Join-Path ([Environment]::GetFolderPath('CommonApplicationData')) 'SAGE'
          if (Test-Path -LiteralPath $state) { Remove-Item -LiteralPath $state -Recurse -Force }

      - name: Provar serviços privados e recuperação
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sage-release-smoke'
          $program = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'SAGE'
          $state = Join-Path ([Environment]::GetFolderPath('CommonApplicationData')) 'SAGE'
          if (Test-Path -LiteralPath $program) { throw 'Program Files não está limpo para o smoke' }
          Copy-Item -LiteralPath $output -Destination $program -Recurse
          $provision = Join-Path $program 'service\provision-services.ps1'
          & $provision
          if (-not $?) { throw 'Primeiro provisionamento dos serviços falhou' }

          $release = Get-Content -LiteralPath (Join-Path $program 'release.json') -Raw | ConvertFrom-Json
          $config = Join-Path $state 'config'
          $api = Join-Path $program "releases\$($release.version)\api"
          $secretBytes = [byte[]]::new(32)
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($secretBytes) } finally { $rng.Dispose() }
          $env:SAGE_INITIAL_ADMIN_LOGIN = 'windows_service_ci'
          $env:SAGE_INITIAL_ADMIN_PASSWORD = [Convert]::ToBase64String($secretBytes).Replace('+', '-').Replace('/', '_')
          $env:SAGE_INITIAL_SCHOOL_NAME = 'Unidade Serviço CI'
          $env:SAGE_CONFIG_FILE = Join-Path $config 'maintenance.env'
          Push-Location -LiteralPath $api
          try {
            & (Join-Path $program 'runtime\node\node.exe') scripts/setup-database.js
            if ($LASTEXITCODE -ne 0) { throw 'Setup anterior ao serviço API falhou' }
          } finally {
            Pop-Location
            Remove-Item Env:SAGE_INITIAL_ADMIN_LOGIN, Env:SAGE_INITIAL_ADMIN_PASSWORD, `
              Env:SAGE_INITIAL_SCHOOL_NAME, Env:SAGE_CONFIG_FILE
          }

          & $provision -StartApi
          if (-not $?) { throw 'Ativação dos serviços falhou' }
          & $provision -StartApi
          if (-not $?) { throw 'Segundo provisionamento não foi idempotente' }

          $mysqlService = Get-CimInstance Win32_Service -Filter "Name='SAGEMySQL'"
          $apiService = Get-CimInstance Win32_Service -Filter "Name='SAGEAPI'"
          if ($mysqlService.StartName -ne 'NT AUTHORITY\LocalService' -or
              $apiService.StartName -ne 'NT AUTHORITY\LocalService') { throw 'Conta dos serviços diverge' }
          if ($mysqlService.StartMode -ne 'Auto' -or $apiService.StartMode -ne 'Auto') {
            throw 'Serviços não estão automáticos'
          }
          $delayed = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\SAGEAPI'
          if ($delayed.DelayedAutoStart -ne 1) { throw 'SAGEAPI não usa início automático atrasado' }
          if ((Get-Service SAGEAPI).RequiredServices.Name -notcontains 'SAGEMySQL') {
            throw 'Dependência SAGEAPI -> SAGEMySQL ausente'
          }
          $sqlListeners = @(Get-NetTCPConnection -State Listen -LocalPort 3307 -ErrorAction SilentlyContinue)
          if ($sqlListeners.Count -eq 0 -or @($sqlListeners | Where-Object LocalAddress -ne '127.0.0.1').Count) {
            throw 'MySQL clássico não está restrito ao loopback'
          }
          if (Get-NetTCPConnection -State Listen -LocalPort 33060 -ErrorAction SilentlyContinue) {
            throw 'MySQL X Protocol foi exposto'
          }

          function Wait-SageReady {
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              try {
                $body = Invoke-RestMethod 'http://127.0.0.1:3000/ready' -TimeoutSec 2
                if ($body.status -eq 'ready' -and $body.version -eq $release.version) { return }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw 'SAGEAPI não recuperou readiness'
          }
          Wait-SageReady
          $nodeBefore = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object CommandLine -Match 'start-with-setup\.js' | Select-Object -First 1
          if ($null -eq $nodeBefore) { throw 'Processo principal da API não encontrado' }
          $childBefore = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object ParentProcessId -eq $nodeBefore.ProcessId | Select-Object -First 1
          if ($null -eq $childBefore) { throw 'Processo HTTP filho não encontrado' }
          Stop-Process -Id $nodeBefore.ProcessId -Force
          Wait-SageReady
          $nodeAfter = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object CommandLine -Match 'start-with-setup\.js' | Select-Object -First 1
          if ($null -eq $nodeAfter -or $nodeAfter.ProcessId -eq $nodeBefore.ProcessId) {
            throw 'WinSW não reiniciou a API'
          }
          $childAfter = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object ParentProcessId -eq $nodeAfter.ProcessId | Select-Object -First 1
          if ($null -eq $childAfter -or
              $null -ne (Get-Process -Id $childBefore.ProcessId -ErrorAction SilentlyContinue)) {
            throw 'WinSW preservou processo órfão da API'
          }
          $mysqlProcess = Get-CimInstance Win32_Process -Filter "Name='mysqld.exe'" |
            Where-Object CommandLine -Match 'SAGEMySQL' | Select-Object -First 1
          if ($null -eq $mysqlProcess) { throw 'Processo SAGEMySQL não encontrado' }
          Stop-Process -Id $mysqlProcess.ProcessId -Force
          Wait-SageReady
          $mysqlAfter = Get-CimInstance Win32_Process -Filter "Name='mysqld.exe'" |
            Where-Object CommandLine -Match 'SAGEMySQL' | Select-Object -First 1
          if ($null -eq $mysqlAfter -or $mysqlAfter.ProcessId -eq $mysqlProcess.ProcessId) {
            throw 'SCM não reiniciou o MySQL'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $state 'logs\api\SAGE-API.out.log'))) {
            throw 'Log rotativo da API não foi criado'
          }
          $secretValues = Get-Content (Join-Path $config 'sage.env'), (Join-Path $config 'maintenance.env') |
            Where-Object { $_ -match '^(?:DB_PASSWORD|JWT_SECRET|MONITOR_CALLBACK_TOKEN)=' } |
            ForEach-Object { $_.Substring($_.IndexOf('=') + 1) }
          $observed = @((Get-CimInstance Win32_Process).CommandLine) +
            @([IO.File]::ReadAllText((Join-Path $program 'service\SAGE-API.xml'))) +
            @(Get-ChildItem (Join-Path $state 'logs') -File -Recurse | Get-Content -ErrorAction SilentlyContinue)
          foreach ($secret in $secretValues) {
            if (($observed -join "`n").Contains($secret)) { throw 'Segredo apareceu em processo, XML ou log' }
          }

      - name: Descartar serviços do smoke
        if: always()
        shell: powershell
        run: |
          $program = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'SAGE'
          $apiService = Get-Service SAGEAPI -ErrorAction SilentlyContinue
          if ($null -ne $apiService) {
            if ($apiService.Status -ne 'Stopped') { Stop-Service SAGEAPI -Force }
            $winsw = Join-Path $program 'service\SAGE-API.exe'
            if (Test-Path -LiteralPath $winsw) { & $winsw uninstall }
          }
          $mysqlService = Get-Service SAGEMySQL -ErrorAction SilentlyContinue
          if ($null -ne $mysqlService) {
            if ($mysqlService.Status -ne 'Stopped') { Stop-Service SAGEMySQL -Force }
            $mysqld = Join-Path $program 'runtime\mysql\bin\mysqld.exe'
            if (Test-Path -LiteralPath $mysqld) { & $mysqld --remove SAGEMySQL }
          }
          $programPrefix = $program.TrimEnd('\') + '\'
          $remaining = @(Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -and $_.ExecutablePath.StartsWith(
              $programPrefix, [StringComparison]::OrdinalIgnoreCase
            )
          })
          foreach ($process in $remaining) {
            Write-Host "Encerrando processo residual do SAGE: $($process.Name) ($($process.ProcessId))"
            Stop-Process -Id $process.ProcessId -Force
          }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $remaining = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith(
                $programPrefix, [StringComparison]::OrdinalIgnoreCase
              )
            })
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          }
          if ($remaining.Count -ne 0) { throw 'Processo residual do SAGE não encerrou' }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $program); $attempt++) {
            try {
              Remove-Item -LiteralPath $program -Recurse -Force -ErrorAction Stop
            } catch {
              if ($attempt -eq 19) { throw }
              Start-Sleep -Milliseconds 500
            }
          }
          $state = Join-Path ([Environment]::GetFolderPath('CommonApplicationData')) 'SAGE'
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $state); $attempt++) {
            try {
              Remove-Item -LiteralPath $state -Recurse -Force -ErrorAction Stop
            } catch {
              if ($attempt -eq 19) { throw }
              Start-Sleep -Milliseconds 500
            }
          }

      - name: Descartar protótipo
        if: always()
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sage-release-smoke'
          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
