name: CI

# Fase 1 — rede de segurança. O objetivo deste pipeline é impedir que um merge vermelho entre.
# Ele roda com MySQL de verdade (não SQLite fingindo ser MySQL): as diferenças de fuso, ENUM e
# constraint são justamente o que precisamos testar.
on:
  push:
    branches: [main, integration, 'f*/**']
  pull_request:

env:
  # Trocar para main quando a branch temporária do frontend for integrada.
  FRONTEND_REF: wip/recuperacao-local-pre-auditoria

jobs:
  caminhos:
    runs-on: ubuntu-latest
    outputs:
      instalador: ${{ steps.filtro.outputs.instalador || steps.push_main.outputs.instalador }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filtro
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" |
            grep -Eq '^(installer/|\.github/workflows/)'; then
            echo "instalador=true" >> "$GITHUB_OUTPUT"
          else
            echo "instalador=false" >> "$GITHUB_OUTPUT"
          fi
      - id: push_main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "instalador=true" >> "$GITHUB_OUTPUT"

  teste:
    runs-on: ubuntu-latest

    services:
      mysql:
        # 8.4 LTS: é a versão que o instalador deve levar para as escolas. Testar em outra
        # versão daria uma confiança que não corresponde ao que roda em produção.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha_de_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psenha_de_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: senha_de_ci
      DB_NAME: sage_ci_teste
      JWT_SECRET: chave_de_ci_com_mais_de_32_caracteres_aleatorios
      NODE_ENV: test
      LOG_LEVEL: error
      REQUIRE_TEST_DB: 'true'
      SAGE_DATA_DIR: /tmp/sage-ci-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          falhou=0
          for f in $(git ls-files '*.js' | grep -v node_modules); do
            node --check "$f" || { echo "ERRO DE SINTAXE: $f"; falhou=1; }
          done
          exit $falhou

      - name: Bloquear consoles e catches vazios em src
        run: npm run lint:src

      - name: Bloquear DDL destrutivo fora do ledger
        run: node scripts/check-expand-only-migrations.js

      - name: Preparar banco descartável
        run: npm run test:db:setup

      - name: Testes
        run: npm test

      # Guarda específica contra o achado A-2 (docs/ACHADOS-INSTALADOR.md): o instalador já
      # reportou sucesso enquanto criava ZERO tabelas. Aqui provamos que uma instalação limpa
      # realmente provisiona o banco — e que o processo falha alto quando não provisiona.
      - name: Instalador provisiona o banco de verdade
        env:
          DB_NAME: sage_ci_instalacao_teste
        run: |
          export SAGE_INITIAL_ADMIN_LOGIN="ci-${GITHUB_RUN_ID}"
          export SAGE_INITIAL_ADMIN_PASSWORD="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('base64url'))")"
          export SAGE_INITIAL_SCHOOL_NAME="Unidade CI"
          node scripts/setup-database.js
          total=$(mysql -h 127.0.0.1 -u root -psenha_de_ci -N -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='sage_ci_instalacao_teste'")
          echo "tabelas criadas: $total"
          if [ "$total" -lt 20 ]; then
            echo "FALHA: instalacao criou apenas $total tabelas"
            exit 1
          fi

      - name: Instalador falha alto quando uma migration quebra
        env:
          DB_NAME: sage_ci_falha_teste
        run: |
          bad=database/migration_zzz_ci_falha_proposital.sql
          echo "ALTER TABLE TabelaQueNaoExiste ADD COLUMN x INT;" > "$bad"
          set +e
          node scripts/setup-database.js
          rc=$?
          set -e
          rm -f "$bad"
          if [ "$rc" -eq 0 ]; then
            echo "FALHA: instalador terminou com 0 mesmo com migration quebrada (regressao do A-2)"
            exit 1
          fi
          echo "ok: instalador terminou com $rc"

  instalador:
    needs: caminhos
    if: needs.caminhos.outputs.instalador == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          path: api

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Nexus-Evolution-Tech/SAGE
          ref: ${{ env.FRONTEND_REF }}
          path: web

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Baixar e verificar Inno Setup 6.7.3
        shell: powershell
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $esperado = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $arquivo = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $arquivo
          $obtido = (Get-FileHash -LiteralPath $arquivo -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($obtido -ne $esperado) { throw "SHA-256 do Inno Setup diverge: $obtido" }
          $processo = Start-Process -FilePath $arquivo -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($processo.ExitCode -ne 0) { throw "Instalador do Inno Setup falhou com exit $($processo.ExitCode)" }

      - name: Montar layout interno
        shell: powershell
        run: |
          $api = Join-Path $env:GITHUB_WORKSPACE 'api'
          $web = Join-Path $env:GITHUB_WORKSPACE 'web'
          $work = Join-Path $env:RUNNER_TEMP 'sage-build'
          $layout = Join-Path $env:RUNNER_TEMP 'sage-layout'
          & (Join-Path $api 'installer\windows\build-release.ps1') `
            -ApiRepository $api -WebRepository $web `
            -WorkDirectory $work -OutputDirectory $layout
          if ($LASTEXITCODE -ne 0) { throw 'build-release.ps1 falhou' }

      - name: Compilar instalador Inno Setup
        shell: powershell
        run: |
          $api = Join-Path $env:GITHUB_WORKSPACE 'api'
          $layout = Join-Path $env:RUNNER_TEMP 'sage-layout'
          $output = Join-Path $env:RUNNER_TEMP 'sage-installer'
          & (Join-Path $api 'installer\windows\build-installer.ps1') `
            -LayoutDirectory $layout -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'build-installer.ps1 falhou' }
          if (-not (Get-ChildItem -LiteralPath $output -Filter '*.exe' -File)) {
            throw 'Nenhum instalador .exe foi produzido'
          }

  contrato-websocket:
    name: Contrato WebSocket (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FRONTEND_PATH: ../web
      JWT_SECRET: chave-de-ci-websocket-com-mais-de-32-caracteres
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          path: api

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Nexus-Evolution-Tech/SAGE
          ref: ${{ env.FRONTEND_REF }}
          path: web

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Instalar dependências da API
        run: npm ci
        working-directory: api

      - name: Executar contrato WebSocket e guard nginx
        run: npx vitest run ci/r1-05f-websocket-proxy.test.js
        working-directory: api
