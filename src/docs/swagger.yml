          application/json:
            schema:
              $ref: '#/components/schemas/Responsavel'
            example:
              nome: "Carlos Souza"
              rg: "123456789"
              cpf: "12345678900"
              email: "carlos.souza@exemplo.com"
              telefone: "11988887777"
      responses:
        '201':
