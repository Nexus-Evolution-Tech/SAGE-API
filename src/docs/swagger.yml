openapi: 3.0.0
info:
  title: Checkly API
  version: 1.0.0
  description: API para gerenciamento de turmas, cursos, dispositivos, pessoas e escolas

servers:
  - url: http://localhost:3000

tags:
  - name: Cursos
    description: Operações relacionadas aos cursos
  - name: Escolas
    description: Operações relacionadas às escolas
  - name: Turmas
    description: Operações relacionadas às turmas
  - name: Areas
    description: Operações relacionadas às áreas
  - name: Dispositivos
    description: Operações relacionadas aos dispositivos
  - name: Empresas
    description: Operações relacionadas às empresas
  - name: Responsaveis
    description: Operações relacionadas aos responsáveis
  - name: Pessoas
    description: Operações relacionadas às pessoas
  - name: Materias
    description: Operações relacionadas às matérias
  - name: Aulas
    description: Operações relacionadas às aulas
  - name: Acessos
    description: Operações relacionadas aos acessos

paths:
  /cursos:
    get:
      tags: [Cursos]
      summary: Lista todos os cursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
    post:
      tags: [Cursos]
      summary: Cria um novo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Curso de Informática"
              duracao: 400
      responses:
        '201':
          description: Curso criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Cursos]
      summary: Retorna um curso pelo ID
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    patch:
      tags: [Cursos]
      summary: Atualizar um curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Desenvolvimento de Sistemas"
              duracao: 500
      responses:
        '200':
          description: Curso atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    delete:
      tags: [Cursos]
      summary: Remove um curso
      responses:
        '204':
          description: Curso deletado
        '404':
          description: Curso não encontrado

  /escolas:
    get:
      tags: [Escolas]
      summary: Lista todas as escolas
      responses:
        '200':
          description: Lista de escolas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escola'
    post:
      tags: [Escolas]
      summary: Cria uma nova escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "Escola Modelo"
              numero: "123"
              cnpj: "98765432000100"
              login: "escola123"
              senha: "senha123"
              endereco: "Rua Exemplo, 123, Centro"
              logo: "logo_etec.png"
      responses:
        '201':
          description: Escola criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'

  /escolas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Escolas]
      summary: Retorna uma escola pelo ID
      responses:
        '200':
          description: Escola encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    patch:
      tags: [Escolas]
      summary: Atualiza uma escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "ETEC Taboão da Serra"
              numero: "293"
              cnpj: "44591997000177"
              login: "etec"
              senha: "etec"
              endereco: "Praça Miguel Ortega, 135 - Parque Assuncao, Taboão da Serra - SP, 06754-160"
              logo: "logo_etec2.png"
      responses:
        '200':
          description: Escola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    delete:
      tags: [Escolas]
      summary: Remove uma escola
      responses:
        '204':
          description: Escola deletada
        '404':
          description: Escola não encontrada

  /turmas:
    get:
      tags: [Turmas]
      summary: Lista todas as turmas
      responses:
        '200':
          description: Lista de turmas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turma'
    post:
      tags: [Turmas]
      summary: Cria uma nova turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma A"
              turno: "MATUTINO"
              curso_id: null
              unidade_id: null
      responses:
        '201':
          description: Turma criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'

  /turmas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Turmas]
      summary: Retorna uma turma pelo ID
      responses:
        '200':
          description: Turma encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    patch:
      tags: [Turmas]
      summary: Atualiza uma turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma B"
              turno: "VESPERTINO"
              curso_id: 1
              unidade_id: 1
      responses:
        '200':
          description: Turma atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    delete:
      tags: [Turmas]
      summary: Remove uma turma
      responses:
        '204':
          description: Turma deletada
        '404':
          description: Turma não encontrada

  /areas:
    get:
      tags: [Areas]
      summary: Lista todas as areas
      responses:
        '200':
          description: Lista de areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
    post:
      tags: [Areas]
      summary: Cria uma nova Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Portaria"
              unidade_id: null
      responses:
        '201':
          description: Area criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'

  /areas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Areas]
      summary: Retorna uma Area pelo ID
      responses:
        '200':
          description: Area encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area não encontrada
    patch:
      tags: [Areas]
      summary: Atualiza uma Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Pátio"
              unidade_id: 1 
      responses:
        '200':
          description: Area atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area não encontrada
    delete:
      tags: [Areas]
      summary: Remove uma turma
      responses:
        '204':
          description: Turma deletada
        '404':
          description: Turma não encontrada

  /dispositivos:
    get:
      tags: [Dispositivos]
      summary: Lista todos os dispositivos
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispositivo'
    post:
      tags: [Dispositivos]
      summary: Cria um novo dispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
            example:
              nome: "Catraca 1"
              modelo: "CT-500"
              endereco: "192.168.0.10"
              porta: 8080
              usuario: "admin"
              senha: "1234"
              area_id: null
              numero_serial: "1234567"
      responses:
        '201':
          description: Dispositivo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'

  /dispositivos/status:
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]
  
  /dispositivos/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]

  /dispositivos/{id}:
