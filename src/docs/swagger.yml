components:
  schemas:
    Curso:
      type: object
      properties:
        nome:
          type: string
        duracao:
          type: integer
    
    Escola:
      type: object
      properties:
        nome:
          type: string
        numero_unidade:
          type: string
        cnpj:
          type: string
        login:
          type: string
        senha:
          type: string
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
          description: "CEP com exatamente 8 dígitos numéricos"
          example: "12345678"
          pattern: "^[0-9]{8}$"
        telefone_contato:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        logo:
          type: string

    FotoEscola:
      type: object
      properties:
        unidade_id:
          type: integer
        tipo:
          type: string
          enum: [FACHADA, PLANTA, EVENTOS, INTERNA, EXTERNA, LOGO, OUTRO]
        caminho:
          type: string
        descricao:
          type: string

    Turma:
      type: object
      properties:
        nome:
          type: string
        turno:
          type: string
          enum: [MATUTINO, VESPERTINO, NOTURNO, INTEGRAL]
        curso_id:
          type: string
          format: integer
        unidade_id:
          type: string
          format: integer

    Area:
      type: object
      properties:
        nome:
          type: string
        unidade_id:
          type: integer

    Dispositivo:
      type: object
      properties:
        nome:
          type: string
        modelo:
          type: string
        endereco:
          type: string
          format: ipv4
        porta:
          type: integer
        usuario:
          type: string
        senha:
          type: string
    
    Empresa:
      type: object
      properties:
        nome:
          type: string
        cnpj:
          type: string
          description: "CNPJ com exatamente 14 dígitos numéricos"
          example: "12345678901234"
          pattern: "^[0-9]{14}$"    
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
          description: "CEP com exatamente 8 dígitos numéricos"
          example: "12345678"
          pattern: "^[0-9]{8}$"
        telefone_contato:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
          
    Responsavel:
      type: object
      properties:
        nome:
          type: string
        rg:
          type: string
          description: "RG com exatamente 7 ou 9 dígitos numéricos"
          example: "1234567 ou 123456789"
          pattern: "^[0-9]{7}$|^[0-9]{9}$"
        cpf:
          type: string
          description: "CPF com exatamente 11 dígitos numéricos"
          example: "12345678901"
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        email:
          type: string
          format: email

    # Modelo base genérico com todos os campos possíveis
    Pessoa:
      type: object
      properties:
        nome:
          type: string
        foto:
          type: string
        rg:
          type: string
          description: "RG com exatamente 7 ou 9 dígitos numéricos"
          example: "1234567 ou 123456789"
          pattern: "^[0-9]{7}$|^[0-9]{9}$"
        cpf:
          type: string
          description: "CPF com exatamente 11 dígitos numéricos"
          example: "12345678901"
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        email:
          type: string
          format: email
        unidade_id:
          type: integer
        qr_code:
          type: string
        cartao_rfid:
          type: string
        senha_acesso:
          type: string
        tipo:
          type: string
          enum: [ALUNO, PROFESSOR, ADMINISTRADOR, PROFADM, TERCEIRIZADO]

