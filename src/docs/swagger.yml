components:
  schemas:
    Curso:
      type: object
      properties:
        nome:
          type: string
        duracao:
          type: integer
    
    Escola:
      type: object
      properties:
        nome:
          type: string
        numero:
          type: string
        cnpj:
          type: string
        login:
          type: string
        senha:
          type: string
        endereco:
          type: string
        logo:
          type: string

    Turma:
      type: object
      properties:
        nome:
          type: string
        turno:
          type: string
          enum: [MATUTINO, VESPERTINO, NOTURNO, INTEGRAL]
        curso_id:
          type: string
          format: integer
        unidade_id:
          type: string
          format: integer

    Area:
      type: object
      properties:
        nome:
          type: string
        unidade_id:
          type: integer

    Dispositivo:
      type: object
      properties:
        nome:
          type: string
        modelo:
          type: string
        endereco:
          type: string
          format: ipv4
        porta:
          type: integer
        usuario:
          type: string
        senha:
          type: string
    
    Empresa:
      type: object
      properties:
        nome:
          type: string
        cnpj:
          type: string
          description: "CNPJ com exatamente 14 dígitos numéricos"
          example: "12345678901234"
          pattern: "^[0-9]{14}$"    
          
    Responsavel:
      type: object
      properties:
        nome:
          type: string
        rg:
          type: string
          description: "RG com exatamente 7 ou 9 dígitos numéricos"
          example: "1234567 ou 123456789"
          pattern: "^[0-9]{7}$|^[0-9]{9}$"
        cpf:
          type: string
          description: "CPF com exatamente 11 dígitos numéricos"
          example: "12345678901"
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        email:
          type: string
          format: email

    # Modelo base genérico com todos os campos possíveis
    Pessoa:
      type: object
      properties:
        nome:
          type: string
        foto:
          type: string
        rg:
          type: string
          description: "RG com exatamente 7 ou 9 dígitos numéricos"
          example: "1234567 ou 123456789"
          pattern: "^[0-9]{7}$|^[0-9]{9}$"
        cpf:
          type: string
          description: "CPF com exatamente 11 dígitos numéricos"
          example: "12345678901"
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        email:
          type: string
          format: email
        unidade_id:
          type: integer
        qr_code:
          type: string
        cartao_rfid:
          type: string
        senha_acesso:
          type: string
        tipo:
          type: string
          enum: [ALUNO, PROFESSOR, ADMINISTRADOR, PROFADM, TERCEIRIZADO]

    # Exemplos de especializações via herança `allOf`
    Aluno:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - turma_id
            - rm
          properties:
            tipo:
              type: string
              enum: [ALUNO]
            turma_id:
              type: integer
            rm:
              type: string
            responsavel_id:
              type: integer

    Professor:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - siape
          properties:
            tipo:
              type: string
              enum: [PROFESSOR]
            siape:
              type: string

    Administrador:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - funcao
          properties:
            tipo:
              type: string
              enum: [ADMINISTRADOR]
            funcao:
              type: string

    ProfAdm:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - siape
            - funcao
          properties:
            tipo:
              type: string
              enum: [PROFADM]
            siape:
              type: string
            funcao:
              type: string

    Terceirizado:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - empresa_id
            - funcao
          properties:
            tipo:
              type: string
              enum: [TERCEIRIZADO]
            empresa_id:
              type: integer
            funcao:
              type: string
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        foto:
          type: string
        unidade_id:
          type: integer
        tipo:
          type: string
        empresa_id:
          type: integer
        funcao:
          type: string

    Materia:
      type: object
      properties:
        nome:
          type: string
        professor_id:
          type: integer
        curso_id:
          type: integer
    
    Aula:
      type: object
      properties:
        nome:
          type: string
        professor_id:
          type: integer
        turma_id:
          type: integer
        materia_id:
          type: integer
        inicio:
          type: string
        fim:
          type: string
        dia_semana:
          type: string
          enum: [DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO]

    Acesso:
      type: object
      properties:
        nome:
          type: string
        pessoa_id:
          type: integer
        dispositivo_id:
          type: integer
        status:
          type: string
          enum: [ENTRADA, SAIDA]
        permitido:
          type: boolean
        data_hora:
          type: string
        metodo_auth:
          type: string
          enum: [QR_CODE, CARTAO_RFID, SENHA, BIOMETRIA]
