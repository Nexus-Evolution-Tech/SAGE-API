openapi: 3.0.0
info:
  title: SAGE API
  version: 1.0.0
  description: API para gerenciamento de turmas, cursos, dispositivos, pessoas e escolas

security:
  - bearerAuth: []   # aplica globalmente a todas as rotas

servers:
  - url: http://localhost:3000

tags:
  - name: Dados
    description: Exportação/Importação de Dados para o Sistema
  - name: Cursos
    description: Operações relacionadas aos cursos
  - name: Escolas
    description: Operações relacionadas às escolas
  - name: FotoEscolas
    description: Operações relacionadas às fotos das escolas
  - name: Turmas
    description: Operações relacionadas às turmas
  - name: Areas
    description: Operações relacionadas às áreas
  - name: Dispositivos
    description: Operações relacionadas aos dispositivos
  - name: Empresas
    description: Operações relacionadas às empresas
  - name: Pessoas
    description: Operações relacionadas às pessoas
  - name: Materias
    description: Operações relacionadas às matérias
  - name: Aulas
    description: Operações relacionadas às aulas
  - name: Acessos
    description: Operações relacionadas aos acessos
  - name: SolicitacoesAcessos
    description: Operações relacionadas as solicitações de acessos de saída dos alunos menores de idade
  - name: Horarios
    description: Operações relacionadas com os horários dos funcionários
  - name: Atrasos
    description: Operações relacionadas com os atrasos das pessoas de acordo com seu horário previsto de entrada

paths:
  /dados/planilha-modelo:
    get:
      tags: [Dados]
      summary: Baixa a planilha modelo para preenchimento
      responses:
        '200':
          description: Planilha modelo baixada com sucesso
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /dados/importar:
    post:
      tags: [Dados]
      summary: Importa a planilha modelo (Escola, Cursos, Turmas, Catracas e Pessoas)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                planilha:
                  type: string
                  format: binary
                  description: Arquivo da planilha preenchida
                unidade_id:
                  type: integer
                  description: "Opcional. Força o `unidade_id` para criação das pessoas. Se omitido, usa a escola importada ou 1."
              required:
                - planilha
      responses:
        '200':
          description: Dados importados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Importação concluída."
                  resultado:
                    $ref: '#/components/schemas/ImportResult'
        '400':
          description: Erro na requisição (arquivo ausente ou inválido)
        '500':
          description: Erro interno ao processar a planilha
  /dados/exportar:
    get:
      tags: [Dados]
      summary: Exporta os dados do banco de dados para uma planilha no formato da planilha modelo
      responses:
        '200':
          description: Planilha exportada com sucesso
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Erro interno ao gerar a planilha

  /cursos:
    get:
      tags: [Cursos]
      summary: Lista todos os cursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
    post:
      tags: [Cursos]
      summary: Cria um novo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Curso de Informática"
              duracao: 400
      responses:
        '201':
          description: Curso criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Cursos]
      summary: Retorna um curso pelo ID
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    patch:
      tags: [Cursos]
      summary: Atualizar um curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Desenvolvimento de Sistemas"
              duracao: 500
      responses:
        '200':
          description: Curso atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    delete:
      tags: [Cursos]
      summary: Remove um curso
      responses:
        '204':
          description: Curso deletado
        '404':
          description: Curso não encontrado

  /escolas:
    get:
      tags: [Escolas]
      summary: Lista todas as escolas
      responses:
        '200':
          description: Lista de escolas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escola'
    post:
      tags: [Escolas]
      summary: Cria uma nova escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "ETEC Taboão da Serra"
              numero_unidade: "293"
              cnpj: "62823257029344"
              login: "etec"
              senha: "etec123"
              logradouro: "Praça Miguel Ortega"
              numero: "135"
              complemento: "Prédio Principal"
              bairro: "Parque Assunção"
              cidade: "Taboão da Serra"
              estado: "SP"
              cep: "06754160"
              telefone_contato: "1147011856"
              logo: "logo_etec.png"
      responses:
        '201':
          description: Escola criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'

  /escolas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Escolas]
      summary: Retorna uma escola pelo ID
      responses:
        '200':
          description: Escola encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    patch:
      tags: [Escolas]
      summary: Atualiza uma escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "Escola Modelo"
              numero_unidade: "001"
              cnpj: "44591997000177"
              login: "login"
              senha: "senha123"
              logradouro: "Rua Exemplo"
              numero: "001"
              complemento: "Casa"
              bairro: "Centro"
              cidade: "São Paulo"
              estado: "SP"
              cep: "01234567"
              telefone_contato: "1123456789"
              logo: "logo.png"
      responses:
        '200':
          description: Escola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    delete:
      tags: [Escolas]
      summary: Remove uma escola
      responses:
        '204':
          description: Escola deletada
        '404':
          description: Escola não encontrada

  /escolas/login/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Escolas]
      summary: Loga na escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario:
                  type: string
                  example: "etec"
                senha:
                  type: string
                  example: "etec123"
      responses:
        '200':
          description: Login efetuado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logado com sucesso"
                  unidadeId:
                    type: integer
                    example: 1
        '401':
          description: Usuário ou senha inválidos
        '404':
          description: Unidade não encontrada
        '500':
          description: Erro interno
  
  /foto_escolas:
    get:
      tags: [FotoEscolas]
      summary: Lista todas as foto_escolas
      responses:
        '200':
          description: Lista de foto_escolas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FotoEscola'
    post:
      summary: Upload de foto de escola
      description: Envia uma imagem e os dados da foto para o servidor
      tags: [FotoEscolas]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                foto:
                  type: string
                  format: binary
                  description: Arquivo da imagem
                unidade_id:
                  type: integer
                  description: ID da unidade escolar
                tipo:
                  type: string
                  description: Tipo da foto (ex: FACHADA, PLANTA, EVENTOS, INTERNA, EXTERNA, LOGO, OUTROS)
                descricao:
                  type: string
                  description: Descrição da imagem
              required:
                - foto
                - unidade_id
                - tipo
      responses:
        '201':
          description: Upload realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  caminho:
                    type: string
        '400':
          description: Erro na requisição (arquivo ausente ou inválido)
        '500':
          description: Erro interno ao salvar

  /foto_escolas/url:
    get:
      tags: [FotoEscolas]
      summary: Retorna todas as URLs das fotos de escolas
      responses:
        '200':
          description: Lista de URLs das fotos encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                      format: uri

  /foto_escolas/url/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [FotoEscolas]
      summary: Retorna a URL da foto de uma escola pelo ID
      responses:
        '200':
          description: URL da foto encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '404':
          description: Foto não encontrada

  /foto_escolas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [FotoEscolas]
      summary: Retorna uma escola pelo ID
      responses:
        '200':
          description: Escola encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoEscola'
        '404':
          description: Escola não encontrada
    patch:
      tags: [FotoEscolas]
      summary: Atualiza uma escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FotoEscola'
            example:
              unidade_id: 1
              tipo: "PLANTA"
              caminho: "/imagens/planta.png"
              descricao: "Foto da planta da escola"
      responses:
        '200':
          description: Escola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoEscola'
        '404':
          description: Escola não encontrada
    delete:
      tags: [FotoEscolas]
      summary: Remove uma escola
      responses:
        '204':
          description: Escola deletada
        '404':
          description: Escola não encontrada

  /turmas:
    get:
      tags: [Turmas]
      summary: Lista todas as turmas
      responses:
        '200':
          description: Lista de turmas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turma'
    post:
      tags: [Turmas]
      summary: Cria uma nova turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma A"
              turno: "MATUTINO"
              curso_id: null
              unidade_id: null
      responses:
        '201':
          description: Turma criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'

  /turmas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Turmas]
      summary: Retorna uma turma pelo ID
      responses:
        '200':
          description: Turma encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    patch:
      tags: [Turmas]
      summary: Atualiza uma turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma B"
              turno: "VESPERTINO"
              curso_id: 1
              unidade_id: 1
      responses:
        '200':
          description: Turma atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    delete:
      tags: [Turmas]
      summary: Remove uma turma
      responses:
        '204':
          description: Turma deletada
        '404':
          description: Turma não encontrada

  /areas:
    get:
      tags: [Areas]
      summary: Lista todas as areas
      responses:
        '200':
          description: Lista de areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
    post:
      tags: [Areas]
      summary: Cria uma nova Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Portaria"
              unidade_id: null
      responses:
        '201':
          description: Area criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'

  /areas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Areas]
      summary: Retorna uma Area pelo ID
      responses:
        '200':
          description: Area encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area não encontrada
    patch:
      tags: [Areas]
      summary: Atualiza uma Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Pátio"
              unidade_id: 1 
      responses:
        '200':
          description: Area atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area não encontrada
    delete:
      tags: [Areas]
      summary: Remove uma turma
      responses:
        '204':
          description: Turma deletada
        '404':
          description: Turma não encontrada

  /dispositivos:
    get:
      tags: [Dispositivos]
      summary: Lista todos os dispositivos
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispositivo'
    post:
      tags: [Dispositivos]
      summary: Cria um novo dispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
            example:
              nome: "Catraca 1"
              modelo: "CT-500"
              endereco: "192.168.0.10"
              porta: 8080
              usuario: "admin"
              senha: "1234"
              area_id: null
              numero_serial: "1234567"
      responses:
        '201':
          description: Dispositivo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'

  /dispositivos/status:
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]
  
  /dispositivos/discover:
    get:
      tags: [Dispositivos]
      summary: Descobre catracas Control iD na rede local
      parameters:
        - in: query
          name: cidr
          schema:
            type: string
          description: CIDR opcional para varrer (ex. 192.168.0.0/24). Se omitido, usa as sub-redes privadas locais.
        - in: query
          name: ports
          schema:
            type: string
          description: Portas separadas por vírgula (default 80,82)
        - in: query
          name: timeout
          schema:
            type: integer
          description: Timeout em ms por tentativa (default 1200)
        - in: query
          name: concurrency
          schema:
            type: integer
          description: Conexões paralelas (default 64)
      responses:
        '200':
          description: Dispositivos encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  cidrs:
                    type: array
                    items:
                      type: string
                    example: ["192.168.0.0/24"]
                  found:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                          example: "192.168.0.126"
                        port:
                          type: integer
                          example: 80
                        vendor:
                          type: string
                          example: "CONTROLID"
                        name:
                          type: string
                          nullable: true
                        model:
                          type: string
                          nullable: true
                        serial:
                          type: string
                          nullable: true
        '500':
          description: Erro interno

  /dispositivos/quick-add:
    post:
      tags: [Dispositivos]
      summary: Cria rapidamente um dispositivo a partir de IP/porta descoberto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip, port, usuario, senha]
              properties:
                ip:
                  type: string
                  example: "192.168.0.126"
                port:
                  type: integer
                  example: 80
                usuario:
                  type: string
                  example: "admin"
                senha:
                  type: string
                  example: "admin"
                nome:
                  type: string
                  example: "Catraca Entrada Principal"
                area_id:
                  type: integer
                  nullable: true
                modelo:
                  type: string
                  example: "IDAccess"
                numero_serial:
                  type: string
      responses:
        '201':
          description: Dispositivo criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Dispositivo criado"
                  data:
                    $ref: '#/components/schemas/Dispositivo'
                  conectado:
                    type: boolean
                    example: true
        '400':
          description: Parâmetros inválidos
        '500':
          description: Erro interno

  /dispositivos/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]

  /dispositivos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispositivos]
      summary: Retorna um dispositivo pelo ID
      responses:
        '200':
          description: Dispositivo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '404':
          description: Dispositivo não encontrado
    patch:
      tags: [Dispositivos]
      summary: Atualiza um dispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
            example:
              nome: "Catraca 2SS"
              modelo: "ControlID"
              endereco: "192.168.0.11"
              porta: 8000
              usuario: "cid"
              senha: "cid1234"
              area_id: 1
              numero_serial: "5674839"
      responses:
        '200':
          description: Dispositivo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '404':
          description: Dispositivo não encontrado
    delete:
      tags: [Dispositivos]
      summary: Remove um dispositivo
      responses:
        '204':
          description: Dispositivo deletado
        '404':
          description: Dispositivo não encontrado

  /empresas:
    get:
      tags: [Empresas]
      summary: Lista todas as empresas
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
    post:
      tags: [Empresas]
      summary: Cria um nova empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empresa'
            example:
              nome: "Empresa XYZ"
              cnpj: "65297682000191"
              logradouro: "Praça Miguel Ortega"
              numero: "135"
              complemento: "Prédio Principal"
              bairro: "Parque Assunção"
              cidade: "Taboão da Serra"
              estado: "SP"
              cep: "06754160"
              telefone_contato: "1147011856"
      responses:
        '201':
          description: Empresa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'

  /empresas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Empresas]
      summary: Retorna um Empresa pelo ID
      responses:
        '200':
          description: Empresa encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '404':
          description: Empresa não encontrado
    patch:
      tags: [Empresas]
      summary: Atualiza um Empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empresa'
            example:
              nome: "Limpezas X"
              cnpj: "80453991000105"
              logradouro: "Rua Exemplo"
              numero: "001"
              complemento: "Casa"
              bairro: "Centro"
              cidade: "São Paulo"
              estado: "SP"
              cep: "01234567"
              telefone_contato: "1123456789"
      responses:
        '200':
          description: Empresa atualizado
          content:
