              pessoa_id: 1
              dispositivo_id: 1
              status: "SAIDA"
              permitido: false
              metodo_auth: "BIOMETRIA"
      responses:
        '200':
          description: Acesso atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acesso'
        '404':
          description: Acesso não encontrado
    delete:
      tags: [Acessos]
      summary: Remove um acesso
      responses:
        '204':
          description: Acesso deletado
        '404':
          description: Acesso não encontrado

  /solicitacoes-acessos:
    get:
      tags: [SolicitacoesAcessos]
      summary: Lista todos as solicitações de acessos dos alunos menores de idade
      responses:
        '200':
          description: Lista das solicitações de acessos dos alunos menores de idade
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitacaoAcesso'
  
  /solicitacoes-acessos/aprovar/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [SolicitacoesAcessos]
      summary: Aprovar uma solicitação de acesso de um aluno menor de idade
      description: Atualiza o status da solicitação de acesso para APROVADA
      responses:
        '200':
          description: Solicitação de acesso do aluno menor de idade aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAcesso'
        '404':
          description: Solicitação de acesso do aluno menor de idade não encontrada
  
  /solicitacoes-acessos/negar/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [SolicitacoesAcessos]
      summary: Negar uma solicitação de acesso de um aluno menor de idade
      description: Atualiza o status da solicitação de acesso para NEGADA
      responses:
        '200':
          description: Solicitação de acesso do aluno menor de idade negada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAcesso'
        '404':
          description: Solicitação de acesso do aluno menor de idade não encontrada

  /solicitacoes-acessos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [SolicitacoesAcessos]
      summary: Retorna uma solicitação de acesso de um aluno menor de idade pelo ID
      responses:
        '200':
          description: Solicitação de acesso encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAcesso'
        '404':
          description: Solicitação de acesso não encontrada
    delete:
      tags: [SolicitacoesAcessos]
      summary: Remove uma solicitação de acesso de um aluno menor de idade
      description: Exclui uma solicitação de acesso de um aluno menor de idade pelo ID
      responses:
        '204':
          description: Solicitação de acesso de um aluno menor de idade deletada
        '404':
          description: Solicitação de acesso de um aluno menor de idade não encontrada

  /horarios:
    get:
      tags: [Horarios]
      summary: Lista todos os horários
      responses:
        '200':
          description: Lista de horários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Horario'
    post:
      tags: [Horarios]
      summary: Cria um novo horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Horario'
            example:
              pessoa_id: 1
              dia_semana: "SEGUNDA"
              entrada: "07:30:00"
              saida: "15:30:00"
      responses:
        '201':
          description: Horário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'

  /horarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Horarios]
      summary: Retorna um Horário pelo ID
      responses:
        '200':
          description: Horário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '404':
          description: Horário não encontrado
    patch:
      tags: [Horarios]
      summary: Atualizar um Horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Horário'
            example:
              pessoa_id: 1
              dia_semana: "TERCA"
              entrada: "08:20:00"
              saida: "15:30:00"
      responses:
        '200':
          description: Horário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '404':
          description: Horário não encontrado
    delete:
      tags: [Horarios]
      summary: Remove um horário
      responses:
        '204':
          description: Horário deletado
        '404':
          description: Horário não encontrado
  
  /atrasos:
    get:
      tags: [Atrasos]
      summary: Lista todos os horários (atrasos) com paginação
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Número da página (começa em 1)
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Número de registros por página
      responses:
        '200':
          description: Lista paginada de horários (atrasos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Atraso'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 50
                  total:
                    type: integer
                    example: 240
                  totalPages:
                    type: integer
                    example: 5

  /atrasos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Atrasos]
      summary: Retorna um Atraso pelo ID
      responses:
        '200':
          description: Atraso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atraso'
        '404':
          description: Atraso não encontrado
    delete:
      tags: [Atrasos]
      summary: Remove um Atraso
      responses:
        '204':
          description: Atraso deletado
        '404':
          description: Atraso não encontrado

components:
  securitySchemes:
    bearerAuth:        # nome do esquema
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ImportEntityCounts:
      type: object
      properties:
        criados:
          type: integer
          example: 3
        ignorados:
          type: integer
          example: 1

    ImportPessoasCounts:
      type: object
      properties:
        sucesso:
          type: integer
          example: 25
        erros:
          type: integer
          example: 2

    ImportErrorItem:
      type: object
      properties:
        aba:
          type: string
          example: "ALUNO"
        nome:
          type: string
          example: "João da Silva"
        mensagem:
          type: string
          example: "Tipo de pessoa inválido"

    ImportResult:
      type: object
      properties:
        escolas:
          $ref: '#/components/schemas/ImportEntityCounts'
        cursos:
          $ref: '#/components/schemas/ImportEntityCounts'
        turmas:
          $ref: '#/components/schemas/ImportEntityCounts'
        catracas:
          $ref: '#/components/schemas/ImportEntityCounts'
        pessoas:
          $ref: '#/components/schemas/ImportPessoasCounts'
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ImportErrorItem'
    Curso:
      type: object
      properties:
        nome:
          type: string
        duracao:
          type: integer
    
    Escola:
      type: object
      properties:
        nome:
          type: string
        numero_unidade:
          type: string
        cnpj:
          type: string
        login:
          type: string
        senha:
          type: string
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
          description: "CEP com exatamente 8 dígitos numéricos"
          example: "12345678"
          pattern: "^[0-9]{8}$"
        telefone_contato:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        logo:
          type: string

    FotoEscola:
      type: object
      properties:
        unidade_id:
          type: integer
        tipo:
          type: string
          enum: [FACHADA, PLANTA, EVENTOS, INTERNA, EXTERNA, LOGO, OUTRO]
        caminho:
          type: string
        descricao:
          type: string

    Turma:
      type: object
      properties:
        nome:
          type: string
        turno:
          type: string
          enum: [MATUTINO, VESPERTINO, NOTURNO, INTEGRAL]
        curso_id:
          type: string
          format: integer
        unidade_id:
          type: string
          format: integer

    Area:
      type: object
      properties:
        nome:
          type: string
        unidade_id:
          type: integer

    Dispositivo:
      type: object
      properties:
        nome:
          type: string
        modelo:
          type: string
        endereco:
          type: string
          format: ipv4
        porta:
          type: integer
        usuario:
          type: string
        senha:
          type: string
    
    Empresa:
      type: object
      properties:
        nome:
          type: string
        cnpj:
          type: string
          description: "CNPJ com exatamente 14 dígitos numéricos"
          example: "12345678901234"
          pattern: "^[0-9]{14}$"    
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
          description: "CEP com exatamente 8 dígitos numéricos"
          example: "12345678"
          pattern: "^[0-9]{8}$"
        telefone_contato:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
          
    # Modelo base genérico com todos os campos possíveis
    Pessoa:
      type: object
      properties:
        nome:
          type: string
        foto:
          type: string
        rg:
          type: string
          description: "RG com exatamente 7 ou 9 dígitos numéricos"
          example: "1234567 ou 123456789"
          pattern: "^[0-9]{7}$|^[0-9]{9}$"
        cpf:
          type: string
          description: "CPF com exatamente 11 dígitos numéricos"
          example: "12345678901"
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          description: "Telefone com exatamente 10 ou 11 dígitos numéricos"
          example: "1234567890 ou 12345678901"
          pattern: "^[0-9]{10,11}$"
        email:
          type: string
          format: email
        unidade_id:
          type: integer
        qr_code:
          type: string
        cartao_rfid:
          type: string
        senha_acesso:
          type: string
        tipo:
          type: string
          enum: [ALUNO, PROFESSOR, ADMINISTRADOR, PROFADM, TERCEIRIZADO]

    # Exemplos de especializações via herança `allOf`
    Aluno:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - turma_id
            - ra
            - rm
            - status
          properties:
            tipo:
              type: string
              enum: [ALUNO]
            turma_id:
              type: integer
            rm:
              type: string
            responsavel_id:
              type: integer
            status:
              type: string
              enum: [CANCELADO, CONCLUÍDO, DESISTENTE, EM CURSO, RETIDO, TRANCADO, TRANSFERÊNCIA EXPEDIDA, SUSPENSO]
    
    Responsavel:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - aluno_id

    Professor:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
          properties:
            tipo:
              type: string
              enum: [PROFESSOR]

    Administrador:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - cargo
          properties:
            tipo:
              type: string
              enum: [ADMINISTRADOR]
            cargo:
              type: string
              enum: [DIRETOR, VICE_DIRETOR, COORDENADOR_PEDAGOGICO, SECRETARIO_ESCOLAR, TESOUREIRO, SUPERVISOR_ADMINISTRATIVO, AUXILIAR_ADMINISTRATIVO, TECNICO_ADMINISTRATIVO, ORIENTADOR_EDUCACIONAL, COORDENADOR_DE_CURSO, RESPONSAVEL_FINANCEIRO, ALMOXARIFE, BIBLIOTECARIO, OUTRO]
            entrada:
              type: string
            saida:
              type: string
    ProfAdm:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - cargo
          properties:
            tipo:
              type: string
              enum: [PROFADM]
            cargo:
              type: string
              enum: [DIRETOR, VICE_DIRETOR, COORDENADOR_PEDAGOGICO, SECRETARIO_ESCOLAR, TESOUREIRO, SUPERVISOR_ADMINISTRATIVO, AUXILIAR_ADMINISTRATIVO, TECNICO_ADMINISTRATIVO, ORIENTADOR_EDUCACIONAL, COORDENADOR_DE_CURSO, RESPONSAVEL_FINANCEIRO, ALMOXARIFE, BIBLIOTECARIO, OUTRO]

    Terceirizado:
      allOf:
        - $ref: '#/components/schemas/Pessoa'
        - type: object
          required:
            - tipo
            - empresa_id
            - funcao
          properties:
            tipo:
              type: string
              enum: [TERCEIRIZADO]
            empresa_id:
              type: integer
            funcao:
              type: string
              enum: [VIGILANTE, AUXILIAR_LIMPEZA, SEGURANCA, SERVICOS_GERAIS, TECNICO_MANUTENCAO, JARDINEIRO, CANTINEIRO, COZINHEIRO, OUTRO]
            entrada:
              type: string
            saida:
              type: string
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        foto:
          type: string
        unidade_id:
          type: integer
        tipo:
          type: string
        empresa_id:
          type: integer
        funcao:
          type: string

    Materia:
      type: object
      properties:
        nome:
          type: string
        professor_id:
          type: integer
        curso_id:
          type: integer
    
    Aula:
      type: object
      properties:
        nome:
          type: string
        professor_id:
          type: integer
        turma_id:
          type: integer
        materia_id:
          type: integer
        inicio:
          type: string
        fim:
          type: string
        dia_semana:
          type: string
          enum: [DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO]
        divisao:
          type: string
          enum: [DIV_A/B, DIV_A, DIV_B]

    Acesso:
      type: object
      properties:
        nome:
          type: string
        pessoa_id:
          type: integer
        dispositivo_id:
          type: integer
        status:
          type: string
          enum: [ENTRADA, SAIDA]
        permitido:
          type: boolean
        data_hora:
          type: string
        metodo_auth:
          type: string
          enum: [QR_CODE, CARTAO_RFID, SENHA, BIOMETRIA]

    SolicitacaoAcesso:
      type: object
      properties:
        aluno_id:
          type: integer
        data_hora_solicitacao:
          type: string
        motivo:
          type: string
        status:
          type: string
          enum: [PENDENTE, APROVADA, NEGADA]
        data_hora_resposta:
          type: string
        observacao_resposta:
          type: string
    
    Horario:
      type: object
      properties:
        id:
          type: integer
        pessoa_id:
          type: integer
        dia_semana:
          type: string
          enum: [DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO]
        entrada:
          type: string
        saida:
          type: string
    
    Atraso:
      type: object
      properties:
        id:
          type: integer
        pessoa_id:
          type: integer
        data:
          type: string
        horario_previsto:
          type: string
        horario_chegada:
          type: string
