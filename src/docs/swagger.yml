          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
            example:
              nome: "Catraca 1"
              modelo: "CT-500"
              endereco: "192.168.0.10"
              porta: 8080
              usuario: "admin"
              senha: "1234"
              area_id: null
              numero_serial: "1234567"
      responses:
        '201':
          description: Dispositivo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'

  /dispositivos/status:
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]
  
  /dispositivos/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispositivos]
      summary: Lista o status de todos os dispositivos
      responses:
        '200':
          description: Lista de status dos dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    status:
                      type: string
                      enum: [ONLINE, OFFLINE]

  /dispositivos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispositivos]
      summary: Retorna um dispositivo pelo ID
      responses:
