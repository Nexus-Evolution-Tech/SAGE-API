  /pessoas/status:
    get:
      tags: [Pessoas]
      summary: Retorna o status de presença de todas as pessoas
      responses:
        '200':
          description: Status da presença da pessoa
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  nome:
                    type: string
                  status:
                    type: string
                    enum: [PRESENTE, AUSENTE]

  /pessoas/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Pessoas]
      summary: Verifica se uma pessoa está presente
      responses:
        '200':
          description: Status da presença da pessoa
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  nome:
                    type: string
                  status:
                    type: string
                    enum: [PRESENTE, AUSENTE]

