    patch:
      tags: [Areas]
      summary: Atualiza uma Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Pátio"
              unidade_id: 1 
      responses:
        '200':
          description: Area atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area não encontrada
    delete:
      tags: [Areas]
      summary: Remove uma turma
