      summary: Cria uma nova Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            example:
              nome: "Portaria"
              unidade_id: null
      responses:
        '201':
          description: Area criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'

  /areas/{id}:
    parameters:
