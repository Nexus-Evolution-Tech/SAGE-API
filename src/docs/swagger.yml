openapi: 3.0.0
info:
  title: Checkly API
  version: 1.0.0
  description: API para gerenciamento de turmas, cursos, dispositivos, pessoas e escolas

servers:
  - url: http://localhost:3000

tags:
  - name: Cursos
    description: Operações relacionadas aos cursos
  - name: Escolas
    description: Operações relacionadas às escolas
  - name: FotoEscolas
    description: Operações relacionadas às fotos das escolas
  - name: Turmas
    description: Operações relacionadas às turmas
  - name: Areas
    description: Operações relacionadas às áreas
  - name: Dispositivos
    description: Operações relacionadas aos dispositivos
  - name: Empresas
    description: Operações relacionadas às empresas
  - name: Responsaveis
    description: Operações relacionadas aos responsáveis
  - name: Pessoas
    description: Operações relacionadas às pessoas
  - name: Materias
    description: Operações relacionadas às matérias
  - name: Aulas
    description: Operações relacionadas às aulas
  - name: Acessos
    description: Operações relacionadas aos acessos
  - name: SolicitacoesAcessos
    description: Operações relacionadas as solicitações de acessos de saída dos alunos menores de idade

paths:
  /cursos:
    get:
      tags: [Cursos]
      summary: Lista todos os cursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
    post:
      tags: [Cursos]
      summary: Cria um novo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Curso de Informática"
              duracao: 400
      responses:
        '201':
          description: Curso criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Cursos]
      summary: Retorna um curso pelo ID
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    patch:
      tags: [Cursos]
      summary: Atualizar um curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
            example:
              nome: "Desenvolvimento de Sistemas"
              duracao: 500
      responses:
        '200':
          description: Curso atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso não encontrado
    delete:
      tags: [Cursos]
      summary: Remove um curso
      responses:
        '204':
          description: Curso deletado
        '404':
          description: Curso não encontrado

  /escolas:
    get:
      tags: [Escolas]
      summary: Lista todas as escolas
      responses:
        '200':
          description: Lista de escolas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escola'
    post:
      tags: [Escolas]
      summary: Cria uma nova escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "ETEC Taboão da Serra"
              numero_unidade: "293"
              cnpj: "62823257029344"
              login: "etec"
              senha: "etec123"
              logradouro: "Praça Miguel Ortega"
              numero: "135"
              complemento: "Prédio Principal"
              bairro: "Parque Assunção"
              cidade: "Taboão da Serra"
              estado: "SP"
              cep: "06754160"
              telefone_contato: "1147011856"
              logo: "logo_etec.png"
      responses:
        '201':
          description: Escola criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'

  /escolas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Escolas]
      summary: Retorna uma escola pelo ID
      responses:
        '200':
          description: Escola encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    patch:
      tags: [Escolas]
      summary: Atualiza uma escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escola'
            example:
              nome: "Escola Modelo"
              numero_unidade: "001"
              cnpj: "44591997000177"
              login: "login"
              senha: "senha123"
              logradouro: "Rua Exemplo"
              numero: "001"
              complemento: "Casa"
              bairro: "Centro"
              cidade: "São Paulo"
              estado: "SP"
              cep: "01234567"
              telefone_contato: "1123456789"
              logo: "logo.png"
      responses:
        '200':
          description: Escola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escola'
        '404':
          description: Escola não encontrada
    delete:
      tags: [Escolas]
      summary: Remove uma escola
      responses:
        '204':
          description: Escola deletada
        '404':
          description: Escola não encontrada

  /foto_escolas:
    get:
      tags: [FotoEscolas]
      summary: Lista todas as foto_escolas
      responses:
        '200':
          description: Lista de foto_escolas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FotoEscola'
    post:
      summary: Upload de foto de escola
      description: Envia uma imagem e os dados da foto para o servidor
      tags: [FotoEscolas]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                foto:
                  type: string
                  format: binary
                  description: Arquivo da imagem
                unidade_id:
                  type: integer
                  description: ID da unidade escolar
                tipo:
                  type: string
                  description: Tipo da foto (ex: FACHADA, PLANTA, EVENTOS, INTERNA, EXTERNA, LOGO, OUTROS)
                descricao:
                  type: string
                  description: Descrição da imagem
              required:
                - foto
                - unidade_id
                - tipo
      responses:
        '201':
          description: Upload realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  caminho:
                    type: string
        '400':
          description: Erro na requisição (arquivo ausente ou inválido)
        '500':
          description: Erro interno ao salvar

  /foto_escolas/url:
    get:
      tags: [FotoEscolas]
      summary: Retorna todas as URLs das fotos de escolas
      responses:
        '200':
          description: Lista de URLs das fotos encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                      format: uri

  /foto_escolas/url/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [FotoEscolas]
      summary: Retorna a URL da foto de uma escola pelo ID
      responses:
        '200':
          description: URL da foto encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '404':
          description: Foto não encontrada

  /foto_escolas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [FotoEscolas]
      summary: Retorna uma escola pelo ID
      responses:
        '200':
          description: Escola encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoEscola'
        '404':
          description: Escola não encontrada
    patch:
      tags: [FotoEscolas]
      summary: Atualiza uma escola
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FotoEscola'
            example:
              unidade_id: 1
              tipo: "PLANTA"
              caminho: "/imagens/planta.png"
              descricao: "Foto da planta da escola"
      responses:
        '200':
          description: Escola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoEscola'
        '404':
          description: Escola não encontrada
    delete:
      tags: [FotoEscolas]
      summary: Remove uma escola
      responses:
        '204':
          description: Escola deletada
        '404':
          description: Escola não encontrada

  /turmas:
    get:
      tags: [Turmas]
      summary: Lista todas as turmas
      responses:
        '200':
          description: Lista de turmas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turma'
    post:
      tags: [Turmas]
      summary: Cria uma nova turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma A"
              turno: "MATUTINO"
              curso_id: null
              unidade_id: null
      responses:
        '201':
          description: Turma criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'

  /turmas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Turmas]
      summary: Retorna uma turma pelo ID
      responses:
        '200':
          description: Turma encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    patch:
      tags: [Turmas]
      summary: Atualiza uma turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Turma'
            example:
              nome: "Turma B"
              turno: "VESPERTINO"
              curso_id: 1
              unidade_id: 1
      responses:
        '200':
          description: Turma atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
        '404':
          description: Turma não encontrada
    delete:
      tags: [Turmas]
      summary: Remove uma turma
      responses:
        '204':
          description: Turma deletada
        '404':
          description: Turma não encontrada

  /areas:
    get:
      tags: [Areas]
      summary: Lista todas as areas
      responses:
        '200':
